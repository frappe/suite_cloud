---
- import_playbook: install-stalwart.yml

- name: Configure the Stalwart node
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Write config.json
      copy:
        content: "{{ config_json }}"
        dest: /etc/stalwart/config.json
        owner: stalwart
        group: stalwart
        mode: "0600"

    - name: Write the runtime environment
      copy:
        content: "{{ env_normal }}"
        dest: /etc/stalwart/stalwart.env
        owner: stalwart
        group: stalwart
        mode: "0600"

    - name: Restart Stalwart
      systemd:
        name: stalwart
        state: restarted
        enabled: true

    - name: Wait for the listeners
      wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 180
      loop: "{{ wait_ports }}"
