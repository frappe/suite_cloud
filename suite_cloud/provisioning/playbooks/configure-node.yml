---
- import_playbook: install-stalwart.yml

- name: Configure the Stalwart node
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Write config.json
      no_log: true
      copy:
        content: "{{ config_json }}"
        dest: /etc/stalwart/config.json
        owner: stalwart
        group: stalwart
        mode: "0600"

    - name: Write the runtime environment
      no_log: true
      copy:
        content: "{{ env_normal }}"
        dest: /etc/stalwart/stalwart.env
        owner: stalwart
        group: stalwart
        mode: "0600"

    - name: Restart Stalwart
      systemd:
        name: stalwart
        state: restarted
        enabled: true

    - name: Wait for the listeners
      wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 180
      loop: "{{ wait_ports }}"

    # Stalwart starts even when stored objects fail to load: it logs and skips them, so the job
    # would pass. It opens its listeners only after logging, so this start's errors are in the log
    # files by now; a node without listeners (outbound role) gets a moment instead. Those are read,
    # not the journal, which gets nothing until a Journal tracer is configured.
    - name: Give a node without listeners time to finish starting
      when: wait_ports | length == 0
      wait_for:
        timeout: 10

    - name: Check the start for configuration errors
      shell: |
        since=$(date -u -d "$(systemctl show -p ActiveEnterTimestamp --value stalwart)" +%Y-%m-%dT%H:%M:%SZ)
        errors=$(grep -hE 'registry\.(validation-error|build-error)' /var/log/stalwart/stalwart* \
          | awk -v since="$since" '$1 >= since')
        [ -z "$errors" ] && exit 0
        echo "$errors" | tail -n 20
        exit 1
      changed_when: false
