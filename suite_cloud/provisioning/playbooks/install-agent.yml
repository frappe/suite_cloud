---
- name: Install the Suite Cloud Agent
  hosts: all
  become: true
  gather_facts: true
  tasks:
    # Telemetry off, or no build yet: a node keeps no agent it cannot use.
    - name: Stop the agent while telemetry is off
      when: not (agent_enabled | bool)
      systemd:
        name: suite-cloud-agent
        state: stopped
        enabled: false
      failed_when: false

    - name: Install and start the agent
      when: agent_enabled | bool
      block:
        - name: Create the agent directories
          file:
            path: "{{ item }}"
            state: directory
            owner: stalwart
            group: stalwart
            mode: "0750"
          loop:
            - /etc/suite-cloud-agent
            - /var/lib/suite-cloud-agent

        # copy skips a binary with the same checksum, and writes a new one beside the running
        # binary before renaming it into place.
        - name: Install the agent binary
          copy:
            src: "{{ agent_binaries[ansible_architecture] }}"
            dest: /usr/local/bin/suite-cloud-agent
            mode: "0755"
          register: agent_binary_file

        - name: Write the agent configuration
          no_log: true
          copy:
            content: "{{ agent_config_json }}"
            dest: /etc/suite-cloud-agent/config.json
            owner: stalwart
            group: stalwart
            mode: "0600"
          register: agent_config_file

        - name: Install the agent systemd unit
          copy:
            content: "{{ agent_systemd_unit }}"
            dest: /etc/systemd/system/suite-cloud-agent.service
            mode: "0644"
          register: agent_unit_file

        - name: Reload systemd for the agent
          systemd:
            daemon_reload: true
          when: agent_unit_file.changed

        - name: Start the agent
          systemd:
            name: suite-cloud-agent
            enabled: true
            state: "{{ 'restarted' if (agent_restart | bool or agent_binary_file.changed or agent_config_file.changed or agent_unit_file.changed) else 'started' }}"

        - name: Check that the agent stays up
          command: systemctl is-active suite-cloud-agent
          register: agent_active
          changed_when: false
          retries: 3
          delay: 2
          until: agent_active.rc == 0
