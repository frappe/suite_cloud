---
- import_playbook: install-stalwart.yml

- name: Bootstrap the Stalwart cluster
  hosts: all
  become: true
  gather_facts: false
  vars:
    cli_env:
      STALWART_URL: "http://127.0.0.1:{{ recovery_port }}"
      STALWART_USER: "{{ admin_user }}"
      STALWART_PASSWORD: "{{ admin_password }}"
  tasks:
    - name: Check whether the server is already bootstrapped
      stat:
        path: /etc/stalwart/config.json
      register: config_file

    - name: Bootstrap the data store
      when: not config_file.stat.exists
      block:
        - name: Write the bootstrap environment
          no_log: true
          copy:
            content: "{{ env_bootstrap }}"
            dest: /etc/stalwart/stalwart.env
            owner: stalwart
            group: stalwart
            mode: "0600"

        - name: Start Stalwart in bootstrap mode
          systemd:
            name: stalwart
            state: restarted

        - name: Wait for the bootstrap listener
          wait_for:
            host: 127.0.0.1
            port: "{{ recovery_port }}"
            timeout: 120

        - name: Write the bootstrap plan
          no_log: true
          copy:
            content: "{{ bootstrap_ndjson }}"
            dest: /etc/stalwart/bootstrap.ndjson
            owner: stalwart
            group: stalwart
            mode: "0600"

        - name: Apply the bootstrap plan
          command: /usr/local/bin/stalwart-cli apply --file /etc/stalwart/bootstrap.ndjson --json
          environment: "{{ cli_env }}"
          register: bootstrap_apply
          failed_when: >-
            bootstrap_apply.rc != 0
            and 'bootstrap mode' not in (bootstrap_apply.stdout + bootstrap_apply.stderr)
            and 'already been initialized' not in (bootstrap_apply.stdout + bootstrap_apply.stderr)

        # config.json only names the data store. When the store was initialised by an earlier
        # run but the file is gone, Stalwart refuses to bootstrap again; writing the file back is
        # all that is needed (it is the same file every other node receives).
        - name: Restore config.json for an initialised data store
          no_log: true
          when: "'already been initialized' in (bootstrap_apply.stdout + bootstrap_apply.stderr)"
          copy:
            content: "{{ config_json }}"
            dest: /etc/stalwart/config.json
            owner: stalwart
            group: stalwart
            mode: "0600"

        - name: Wait for config.json to be written
          wait_for:
            path: /etc/stalwart/config.json
            timeout: 120

        # The first normal start names the node's cluster role (it fails when the role is missing)
        # and imports the spam filter rules, once, from wherever SpamSettings points. Only those
        # are written here: an object Stalwart counts before inserting its defaults (routes,
        # permission roles, tracers) would suppress them.
        - name: Create what the first normal start needs
          block:
            - name: Write the recovery environment for the defaults
              no_log: true
              copy:
                content: "{{ env_recovery }}"
                dest: /etc/stalwart/stalwart.env
                owner: stalwart
                group: stalwart
                mode: "0600"

            - name: Start Stalwart in recovery mode for the defaults
              systemd:
                name: stalwart
                state: restarted

            - name: Wait for the recovery listener for the defaults
              wait_for:
                host: 127.0.0.1
                port: "{{ recovery_port }}"
                timeout: 120

            - name: Write the defaults plan
              copy:
                content: "{{ defaults_ndjson }}"
                dest: /etc/stalwart/defaults.ndjson
                owner: stalwart
                group: stalwart
                mode: "0600"

            - name: Apply the defaults plan
              command: /usr/local/bin/stalwart-cli apply --file /etc/stalwart/defaults.ndjson --json
              environment: "{{ cli_env }}"

        # Stalwart provisions its built-in roles, the default role lists and other defaults only
        # on a normal start; bootstrap and recovery mode skip that step. Without this start the
        # administrator (and every account) would resolve to no permissions at all.
        - name: Write the runtime environment for the first normal start
          no_log: true
          copy:
            content: "{{ env_normal }}"
            dest: /etc/stalwart/stalwart.env
            owner: stalwart
            group: stalwart
            mode: "0600"

        - name: Start Stalwart normally so it provisions its defaults
          systemd:
            name: stalwart
            state: restarted

        - name: Wait for the normal listener
          wait_for:
            host: 127.0.0.1
            port: 443
            timeout: 120

        - name: Stop Stalwart after bootstrap
          systemd:
            name: stalwart
            state: stopped
      always:
        # The plan names the store credentials; it must not outlive the play, failed or not.
        - name: Remove the bootstrap plan
          file:
            path: /etc/stalwart/bootstrap.ndjson
            state: absent

        - name: Remove the defaults plan
          file:
            path: /etc/stalwart/defaults.ndjson
            state: absent

    - name: Check whether this cluster plan version was applied
      stat:
        path: "/etc/stalwart/{{ plan_marker }}"
      register: plan_marker_file

    - name: Apply the cluster plan in recovery mode
      when: not plan_marker_file.stat.exists
      block:
        - name: Write the recovery environment
          no_log: true
          copy:
            content: "{{ env_recovery }}"
            dest: /etc/stalwart/stalwart.env
            owner: stalwart
            group: stalwart
            mode: "0600"

        - name: Start Stalwart in recovery mode
          systemd:
            name: stalwart
            state: restarted

        - name: Wait for the recovery listener
          wait_for:
            host: 127.0.0.1
            port: "{{ recovery_port }}"
            timeout: 120

        - name: Write the cluster plan
          no_log: true
          copy:
            content: "{{ cluster_ndjson }}"
            dest: /etc/stalwart/cluster.ndjson
            owner: stalwart
            group: stalwart
            mode: "0600"

        - name: Apply the cluster plan
          command: /usr/local/bin/stalwart-cli apply --file /etc/stalwart/cluster.ndjson --json
          environment: "{{ cli_env }}"

        - name: Record the applied plan version
          copy:
            content: "{{ config_version }}\n"
            dest: "/etc/stalwart/{{ plan_marker }}"
            mode: "0644"
      always:
        # Whatever happened, neither the plan (relay and store secrets, DNS token) nor the
        # recovery credential in the environment stays on the node.
        - name: Remove the cluster plan
          file:
            path: /etc/stalwart/cluster.ndjson
            state: absent

        - name: Write the runtime environment after the recovery stage
          no_log: true
          copy:
            content: "{{ env_normal }}"
            dest: /etc/stalwart/stalwart.env
            owner: stalwart
            group: stalwart
            mode: "0600"

    - name: Write the runtime environment
      no_log: true
      copy:
        content: "{{ env_normal }}"
        dest: /etc/stalwart/stalwart.env
        owner: stalwart
        group: stalwart
        mode: "0600"

    - name: Ensure no recovery credentials remain
      command: grep -c STALWART_RECOVERY /etc/stalwart/stalwart.env
      register: recovery_leftovers
      changed_when: false
      failed_when: recovery_leftovers.rc == 0

    - name: Restart Stalwart normally
      systemd:
        name: stalwart
        state: restarted
        enabled: true

    - name: Wait for the listeners
      wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 180
      loop: "{{ wait_ports }}"

    # Stalwart starts even when stored objects fail to load: it logs and skips them, so the job
    # would pass. It opens its listeners only after logging, so this start's errors are in the
    # journal by now. The journal drops the details; this start's lines in the log file have them.
    - name: Check the start for configuration errors
      shell: |
        journalctl --no-pager -o cat _SYSTEMD_INVOCATION_ID="$(systemctl show -p InvocationID --value stalwart)" \
          | grep -qxE 'Object validation error|Configuration build error' || exit 0
        since=$(date -u -d "$(systemctl show -p ActiveEnterTimestamp --value stalwart)" +%Y-%m-%dT%H:%M:%SZ)
        grep -hE 'registry\.(validation-error|build-error)' /var/log/stalwart/stalwart.* | awk -v since="$since" '$1 >= since'
        exit 1
      changed_when: false
