[project]
name = "suite_cloud"
authors = [
    { name = "Frappe Technologies Pvt Ltd", email = "developers@frappe.io" },
]
description = "Deploys and manages the infrastructure behind Frappe Suite: Stalwart mail servers today, with clusters, DNS records and Ansible-driven deployments."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dynamic = ["version"]
dependencies = [
    "paramiko~=5.0.0",  # SSH: Server Job, Mail Server checks, cluster keypairs
    "dnspython~=2.6.1",  # DNS Record verification, hostname lookups
    "dns-lexicon~=3.20.1",  # DNS provider API (Route53, Cloudflare, ...)
    "ansible-runner~=2.4.1",  # Server Ansible Play
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<18.0.0"

# Installed from Ubuntu repositories when the app is hosted on Frappe Cloud
[deploy.dependencies.apt]
packages = [
    "ansible",  # ansible-runner drives it for server deployments
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
